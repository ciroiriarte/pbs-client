# Track upstream proxmox-backup releases and publish them to OBS.
#
# OBS cannot watch git.proxmox.com, and the bundle needs multi-repo assembly
# (no OBS source service can do it), so the bump runs here: tools/bump.py
# detects a newer v* tag, assembles the offline bundle and bumps the recipe.
# This job then publishes the bundle as the v<ver> release asset (the spec's
# Source0 URL), pushes the recipe + tools/sources.json pins to main, and fires
# the package's runservice token. OBS re-runs proxmox-backup-client/_service
# (obs_scm pulls the recipe, download_files fetches the bundle) and rebuilds.
#
# Required setting (repo -> Settings -> Secrets and variables -> Actions):
#   secret OBS_SERVICE_TOKEN  runservice token bound to
#                             home:ciriarte:pbs-client/proxmox-backup-client
# A failed run (e.g. build_source.py's sibling-commit guardrail) emails the
# repo owner; fix the pins in tools/sources.json and re-run manually.
name: upstream bump

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream
        id: check
        run: |
          out=$(python3 tools/bump.py --dry-run)
          echo "$out"
          if grep -q '^would bump' <<<"$out"; then echo "bump=1" >> "$GITHUB_OUTPUT"; fi

      - name: Install tooling
        if: steps.check.outputs.bump == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils zstd
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Assemble bundle and bump recipe
        id: bump
        if: steps.check.outputs.bump == '1'
        run: |
          python3 tools/bump.py
          ver=$(sed -n 's/^Version:[[:space:]]*//p' proxmox-backup-client/proxmox-backup-client.spec)
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"

      # Release before pushing: once main has the new spec, any service run
      # (ours or a manual one) must find the Source0 asset.
      - name: Publish bundle as release asset
        if: steps.check.outputs.bump == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.bump.outputs.ver }}
        run: |
          gh release create "v${VER}" "dist/proxmox-backup-client-${VER}.tar.xz" \
            --target "$GITHUB_SHA" --title "proxmox-backup-client ${VER}" \
            --notes "Offline source bundle for upstream proxmox-backup v${VER}."

      - name: Push recipe + pins back to the repo
        if: steps.check.outputs.bump == '1'
        env:
          VER: ${{ steps.bump.outputs.ver }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxmox-backup-client tools/sources.json
          git commit -m "Update to upstream v${VER}"
          git push

      - name: Trigger OBS source service
        if: steps.check.outputs.bump == '1'
        env:
          OBS_SERVICE_TOKEN: ${{ secrets.OBS_SERVICE_TOKEN }}
        run: |
          curl -fsS -X POST -H "Authorization: Token ${OBS_SERVICE_TOKEN}" \
            https://api.opensuse.org/trigger/runservice
